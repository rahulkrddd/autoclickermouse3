<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/css/app.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script><title>Cart</title></head><body><header class="nav"><a class="brand" href="/">AutoClick<span>Mouse</span></a><div class="search"><input id="globalSearch" placeholder="Search AutoClickerMouse"><button>🔍</button></div><div class="navlinks"><button class="pill dark" id="adminBtn">Admin</button><button class="pill dark" id="ordersBtn">My Orders</button><a href="/review">Reviews</a><a href="/FAQs">FAQs</a><a href="/cart">Cart <span class="count" id="cartCount">0</span></a></div></header><main class="shell"><h1>Shopping Cart</h1><div id="rows"></div><div class="order"><h2>Order Summary</h2><p>Total quantity: <b id="totalQty">0</b></p><p>Subtotal: ₹<span id="sub">0</span></p><div class="toolbar"><input id="coupon" placeholder="Coupon code"><button class="pill" id="apply">Apply</button></div><p id="couponMsg"></p><p>Discount: ₹<span id="discount">0</span></p><h2>Total: ₹<span id="total">0</span></h2><button class="pill primary" id="checkout">Proceed to Checkout</button></div></main><div class="modal" id="checkoutModal"><div class="panel"><button class="close">×</button><h2>Secure Checkout</h2><form id="checkoutForm"><div class="field"><label>Name</label><input id="name" required minlength="3"></div><div class="field"><label>Mobile</label><input id="mobile" required pattern="[6-9][0-9]9"></div><div class="field"><label>Address</label><textarea id="address" required minlength="15"></textarea></div><div class="field"><label>Pincode</label><input id="pincode" required pattern="[0-9]6"></div><label class="consent"><input type="checkbox" required> I consent to use of these details for checkout, order support and failure recovery.</label><button class="pill primary">Pay Now</button></form></div></div><div class="modal" id="login"><div class="panel"><button class="close">×</button><h2 id="loginTitle"></h2><form id="loginForm"><div class="field"><label id="loginLabel"></label><input id="loginInput" inputmode="numeric" required></div><div class="notice" id="loginMsg"></div><button class="pill primary">Continue</button></form></div></div><script src="/js/common.js"></script><script src="/js/cart.js"></script><script src="/js/checkout.js"></script></body></html>
