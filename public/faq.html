<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/css/app.css"><title>FAQs</title></head><body><header class="nav"><a class="brand" href="/">AutoClick<span>Mouse</span></a></header><main class="shell"><div class="toolbar"><input id="fq" placeholder="Search FAQs"><select id="fc"><option value="">All</option><option>General</option><option>Payment</option><option>Delivery</option><option>Services</option></select></div><div id="list" class="faq"></div></main><script>const data=[["General", "How do I open product details?", "Click any product image, title or Details button."], ["Payment", "How do coupons work?", "Apply an active coupon in the shopping cart before checkout."], ["Delivery", "How do I track my order?", "Open My Orders with the registered mobile number."], ["Services", "How is warranty claimed?", "Submit all three ratings and a review from My Orders."]],$=s=>document.querySelector(s);function run(){let q=$('#fq').value.toLowerCase(),c=$('#fc').value;$('#list').innerHTML=data.filter(x=>(x.join(' ').toLowerCase().includes(q))&&(!c||x[0]===c)).map((x,i)=>`<div><button class="q">${i+1}. ${x[1]}</button><div class="a"><p>${x[2]}</p><button class="pill" onclick="alert('Thanks for your feedback')">Helpful</button></div></div>`).join('');document.querySelectorAll('.q').forEach(b=>b.onclick=()=>b.nextElementSibling.style.display=b.nextElementSibling.style.display==='block'?'none':'block')}fq.oninput=fc.onchange=run;run()</script></body></html>
